        .top{text-align:center;margin-bottom:20px}

        .ctrl{display:block}

        .btn-row{display:flex;gap:10px;margin-bottom:10px}
        .toggle-btn, .more-btn{
            flex: 1;
            border-radius:8px;
            padding:12px;
            text-align:center;
            cursor:pointer;

            border:none;

        }

        .toggle-btn:hover{background-color:#1765cc}
        .more-btn{background-color:#34a853;color:#fff;}
        .more-btn:hover{background-color:#2d9248}
        .help{background-color:#f8f9fa;border-radius:8px;padding:15px;margin-top:20px;border:1px solid #dadce0}
        .help .title{font-size:18px;font-weight:500;color:#1a73e8;margin-bottom:10px}
        .help .content{font-size:14px;color:#5f6368;line-height:1.5}

        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background-color:#3c4043;color:#fff;padding:10px 20px;border-radius:4px;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease;font-size:14px}

        .modal.show{opacity:1;visibility:visible}
        .modal-box{width:100%;max-width:350px;background:#fff;border-radius:12px;padding:15px;max-height:80vh;overflow-y:auto}
        .modal-title{font-size:18px;text-align:center;margin-bottom:15px;font-weight:500;color:#202124}

        .group-wrap{margin-bottom:18px;}
        .group-title{
            font-size:15px;

            padding-left:4px;

        .video-item{cursor:pointer;border-radius:8px;overflow:hidden;border:1px solid #eee}

<body>

                    <div class="video-item"

                    </div>

    <div class="float-btn" onclick="scrollToTop()">↑</div>
    <div class="toast" id="toast"></div>

    <script>
        const video = document.getElementById('videoPlayer');
        const toggleBtn = document.getElementById('toggleBtn');
        const moreBtn = document.getElementById('moreBtn');
        const modal = document.getElementById('modal');
        const closeModal = document.getElementById('closeModal');
        const videoItems = document.querySelectorAll('.video-item');
        let isPlaying = false;

        function togglePlay(){
            if(isPlaying){
                video.pause();
                video.currentTime = 0;
                toggleBtn.textContent = '♻️ 循环';
                showToast('🛑 停止');
            }else{
                video.loop = true;
                video.play();
                toggleBtn.textContent = '🛑 停止';
                showToast('♻️ 循环');
            }
            isPlaying = !isPlaying;
        }
        toggleBtn.addEventListener('click', togglePlay);

        moreBtn.addEventListener('click',()=> modal.classList.add('show'));
        closeModal.addEventListener('click',()=> modal.classList.remove('show'));

        videoItems.forEach(item=>{
            item.addEventListener('click',function(){
                const src = this.dataset.src;
                const poster = this.dataset.poster;
                const tip = this.dataset.tip;
                video.src = src;
                video.poster = poster;
                video.load();
                video.pause();
                video.currentTime = 0;
                isPlaying = false;
                toggleBtn.textContent = '♻️ 循环';
                modal.classList.remove('show');
                showToast(tip);
            })
        })

        function showToast(message){
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(()=>toast.classList.remove('show'),2000);
        }
        function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'})}
    </script>
